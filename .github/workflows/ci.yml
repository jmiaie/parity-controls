name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fault matrix - every control must fire on its fault
        run: python3 test_parity.py
      - name: demo - the failure in dollars
        run: python3 demo.py
