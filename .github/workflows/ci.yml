# The gate, live on this public repo (Actions is unmetered on public repositories).
#
# History: the private sibling line parked this workflow on 2026-09-18 as ci.yml.disabled
# because its Actions minutes were exhausted - jobs were created and no runner ever picked
# them up. This public companion runs it on every push and pull request.
#
# Jobs:
#   gate    the fault matrix and the demo (scripts, no install), then the pytest suite in
#           tests/ after installing the package with its dev extra - which also proves the
#           packaging installs. Two Pythons: the floor requires-python claims, and current.
#   action  the composite action in action.yml run against tests/fixtures/books: freeze,
#           verify, then a mutated file that verify MUST refuse. An action never observed to
#           refuse is not a control.
#
# ruff is not run: the repo declares it in the dev extra but configures no rules, and the
# default rule set reports 9 findings in existing files (bench.py, tests/). Owner decision.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: fault matrix - every control must fire on its fault
        run: python3 test_parity.py
      - name: demo - the failure in dollars
        run: python3 demo.py
      - name: install the package with the dev extra
        run: python3 -m pip install -e '.[dev]'
      - name: pytest - tests/ (adapter tests skip when dbt / great_expectations are absent)
        run: python3 -m pytest -q -rs

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stage a copy of the fixture
        run: cp -r tests/fixtures/books "$RUNNER_TEMP/books"
      - name: freeze
        uses: ./
        with:
          mode: freeze
          path: ${{ runner.temp }}/books
          lockfile: ${{ runner.temp }}/parity.lock.json
      - name: verify - unchanged data passes
        uses: ./
        with:
          path: ${{ runner.temp }}/books
          lockfile: ${{ runner.temp }}/parity.lock.json
      - name: mutate one cell
        run: sed -i 's/buy,long/buy,short/' "$RUNNER_TEMP/books/positions.csv"
      - name: verify - moved data must be refused
        id: moved
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/books
          lockfile: ${{ runner.temp }}/parity.lock.json
      - name: the refusal happened
        run: |
          test "${{ steps.moved.outcome }}" = failure
          test "${{ steps.moved.outputs.result }}" = violation
