version: 2
updates:
  # The project has zero runtime dependencies (`dependencies = []` in pyproject.toml), so
  # this entry is mostly a no-op. That is the point: if a pull request ever appears here,
  # a dependency has been added without anyone deciding to, and the notice is the decision
  # point. Keep it.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # CI is live (.github/workflows/ci.yml) and pins its actions; keep the bumps coming so the
  # pins stay current. action.yml is a composite action and pins nothing of its own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
